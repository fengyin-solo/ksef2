# Modules published by a baseline release that this SDK no longer exposes.
#
# scripts/check_legacy_compat.py fails when a baseline item goes missing unless
# an entry below covers it, and fails when an entry covers nothing. Every entry
# therefore has to name the decision that removed the path. `kind` is "tree"
# for the path and everything under it, "exact" for the path alone and
# "submodules" for modules under the path while the path itself stays covered.

[[entry]]
path = "ksef2.endpoints"
kind = "tree"
reason = "Deliberately privatised as ksef2._endpoints before 1.0; tests/unit/test_module_visibility_contract.py::test_other_internal_paths_remain_private and docs/en/reference/public-api.md keep it out of the public API."

[[entry]]
path = "ksef2.config"
kind = "tree"
reason = "Deliberately privatised as ksef2._config before 1.0; tests/unit/test_module_visibility_contract.py::test_other_internal_paths_remain_private and docs/en/reference/public-api.md keep it out of the public API."

[[entry]]
path = "ksef2.logging"
kind = "tree"
reason = "Deliberately privatised as ksef2._logging before 1.0; tests/unit/test_module_visibility_contract.py::test_other_internal_paths_remain_private and docs/en/reference/public-api.md keep it out of the public API."

[[entry]]
path = "ksef2.clients"
kind = "submodules"
reason = "Only ksef2.clients itself is public; its implementation modules are ksef2._clients, as tests/unit/test_module_visibility_contract.py::test_other_internal_paths_remain_private records for ksef2.clients.base."

[[entry]]
path = "ksef2.raw.facade"
kind = "tree"
reason = "Deliberately privatised as ksef2._raw.facade before 1.0; tests/unit/test_module_visibility_contract.py::test_other_internal_paths_remain_private and docs/en/reference/public-api.md expose ksef2.raw instead."

[[entry]]
path = "ksef2.raw.async_facade"
kind = "tree"
reason = "Deliberately privatised as ksef2._raw.async_facade before 1.0; tests/unit/test_module_visibility_contract.py::test_other_internal_paths_remain_private and docs/en/reference/public-api.md expose ksef2.raw instead."

[[entry]]
path = "ksef2.infra.mappers.exceptions"
kind = "tree"
reason = "Deleted by #167 (24a77b3, one KSeF error pipeline) before 1.0; its from_* mappers were folded into ksef2._core.response_errors and applications receive the ksef2 exception types instead. Needs maintainer sign-off on #184's stack: restore a shim instead if this path must survive into 1.x."

[[entry]]
path = "ksef2.core.response_errors.mapper"
kind = "exact"
reason = "Module alias for ksef2.infra.mappers.exceptions inside ksef2.core.response_errors, removed together with that module by #167 (24a77b3); see the entry above."

# PersonPermissionDetail subject-entity names (#254, fixes #205): KSeF describes
# the subject entity as fullName plus address only, so the published split-name
# pair could never hold the first and last names its docstrings promised, and it
# dropped the address. Both fields are replaced by entity_full_name and
# entity_address before 1.0. Each entry covers one attribute on one access path
# for the same class, so any other attribute on these paths stays protected.

[[entry]]
path = "ksef2.models.PersonPermissionDetail.entity_first_name"
kind = "exact"
reason = "Removed by #254 (#205) before 1.0: the person-permission payload carries the subject entity as fullName plus address, so this field could never hold a first name. Read PersonPermissionDetail.entity_full_name instead, and entity_address for the address the old pair dropped."

[[entry]]
path = "ksef2.models.PersonPermissionDetail.entity_last_name"
kind = "exact"
reason = "Removed by #254 (#205) before 1.0 for the reason recorded on the entity_first_name entry above: the payload has no last name to map and the mapper copied the full name into both fields. Read PersonPermissionDetail.entity_full_name instead."

[[entry]]
path = "ksef2.domain.models.PersonPermissionDetail.entity_first_name"
kind = "exact"
reason = "Same attribute of the same class reached through the deprecated ksef2.domain alias; removal is justified by the ksef2.models entry above (#254, #205)."

[[entry]]
path = "ksef2.domain.models.PersonPermissionDetail.entity_last_name"
kind = "exact"
reason = "Same attribute of the same class reached through the deprecated ksef2.domain alias; removal is justified by the ksef2.models entries above (#254, #205)."

[[entry]]
